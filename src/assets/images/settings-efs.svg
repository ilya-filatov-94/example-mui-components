<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48">
  <defs>
    <style>
      .text-efs {
        font-family: sans-serif, cursive;
        font-size: 21px;
        font-weight: 700;
        fill: #0000008a;
      }
    </style>
  </defs>

  <!-- Шестерёнка в левом нижнем углу -->
  <g transform="translate(12, 38)">
    <!-- внешнее кольцо -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#0000008a" stroke-width="1.8"/>
    <!-- 8 зубцов -->
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(0)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(45)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(90)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(135)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(180)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(225)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(270)"/>
    <rect x="-1.8" y="-10.5" width="3.6" height="5" fill="#0000008a" transform="rotate(315)"/>
    <!-- центральное отверстие -->
    <circle cx="0" cy="0" r="3" fill="#0000008a"/>
  </g>

  <!-- Надпись «ЕФС» по центру -->
  <text x="38" y="28" class="text-efs" text-anchor="middle" dominant-baseline="central">ЕФС</text>
</svg>